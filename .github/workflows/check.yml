# push のたびに、手元と同じ確認を自動で動かす（FR9.5）。公開リポジトリなら GitHub Actions は無料の範囲（NFR1）。
# 公開（GitHub Pages）はこの確認とは別で、main の /docs がそのまま公開される。
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.158.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Hugo 0.158.0（extended）を入れる
        run: |
          curl -fsSL -o "$RUNNER_TEMP/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
          hugo version

      - name: 確認プログラムの単体テスト
        run: python -m unittest discover -s tools/check/tests -v

      - name: 書き出し（エラー・警告が1件でもあれば失敗）
        run: hugo --source site --cleanDestinationDir

      - name: 書き出したサイト全体の確認
        run: python tools/check/run_checks.py docs

      - name: コミットした docs/ が site/ から書き出したものと同じか
        run: |
          if [ -n "$(git status --porcelain -- docs)" ]; then
            git status --short -- docs
            echo "::error::docs/ が site/ と合っていません。手元で hugo --source site --cleanDestinationDir を実行し、site/ と docs/ を同じコミットに入れてください。"
            exit 1
          fi
