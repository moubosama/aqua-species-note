{{ define "main" }}
{{- /* 見つからないページ（D4）。GitHub Pages はどの URL でもこのページを返すので、リンクはサイトの根からの形にする。 */ -}}
<h1>{{ T "notfound_title" }}</h1>
<p>{{ T "notfound_text" }}</p>
<ul class="links">
<li><a href="{{ site.Home.RelPermalink }}">{{ T "back_home" }}</a></li>
{{- with site.GetPage "/species" }}
<li><a href="{{ .RelPermalink }}">{{ T "species_list" }}</a></li>
{{- end }}
</ul>
{{ end }}
